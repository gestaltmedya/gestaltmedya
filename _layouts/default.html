<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07060f">
  {% seo title=true %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="{{ page.body_class | default: 'page' }}">
  <div class="atmosphere" aria-hidden="true">
    <div class="orb orb--cyan"></div>
    <div class="orb orb--magenta"></div>
    <div class="orb orb--violet"></div>
    <div class="noise"></div>
  </div>

  <a class="skip" href="#icerik">İçeriğe geç</a>
  {% include header.html %}

  <main id="icerik">
    {{ content }}
  </main>

  {% include footer.html %}
  {% if site.goatcounter != "" and jekyll.environment == "production" %}<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>{% endif %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
