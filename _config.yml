# =========================================================
#  GESTALT MEDYA — site ayarları
#  Bu dosyayı değiştirdikten sonra site 1-2 dakikada güncellenir.
# =========================================================

title: "Gestalt Medya"
tagline: "Bütün, parçaların toplamından fazlasıdır."
description: "Gestalt Medya — medya, teknoloji, kültür ve zihin üzerine yazılar."
url: "https://www.gestaltmedya.com"
baseurl: ""
lang: tr_TR
timezone: Europe/Istanbul

author:
  name: "Gestalt Medya"
  # email: ornek@gestaltmedya.com

# Sosyal medya bağlantıları (boş bırakılanlar gösterilmez)
social:
  instagram: "gestaltmedya"
  x: ""              # ör: gestaltmedya
  youtube: "@gestaltmedya"
  linkedin: ""       # ör: company/gestaltmedya
  email: "gestaltmedya@gmail.com"

# Ana sayfada gösterilecek son yazı sayısı (öne çıkan hariç)
home_posts: 6

# ÖNE ÇIKAN YAZI
# En yeni yazının tarihinden geriye doğru bu kadar günlük pencere içindeki
# yazılardan EN ÇOK OKUNAN öne çıkar. Yeni yazı gelmezse pencere kaymaz,
# öne çıkan yerinde kalır. Bir yazıyı elle sabitlemek için o yazının
# başına "featured: true" ekle.
featured_window_days: 14

# Okunma sayısı için GoatCounter (ücretsiz, çerez kullanmaz).
# goatcounter.com'da hesap açınca seçtiğin kodu buraya yaz (ör: gestaltmedya).
# Boşken öne çıkan = penceredeki en yeni yazı.
goatcounter: ""

# KATEGORİLER: her yazının başına tek bir "kategori:" yaz (ör: kategori: teknoloji).
# Renk kartın kapağını, öne çıkan alanın ışığını ve kategori etiketini boyar.
# Sıra, ana sayfadaki sütunların sırasıdır.
kategoriler:
  - id: medya
    ad: Medya
    renk: "#00f0ff"
    aciklama: "Ekranların ve anlatıların nasıl şekillendiği."
  - id: teknoloji
    ad: Teknoloji
    renk: "#8b5cff"
    aciklama: "Geleceğin bugüne sızan sinyalleri."
  - id: kultur
    ad: Kültür
    renk: "#ffb547"
    aciklama: "Sokaktan dijitale, değişen gündelik hayat."
  - id: zihin
    ad: Zihin
    renk: "#d4ff3a"
    aciklama: "Algı, dikkat ve düşünmenin yeni koşulları."

# Paylaşım görseli: link WhatsApp/X/LinkedIn'de paylaşılınca çıkan kart.
# Yazının kendi "image:" görseli varsa o kullanılır, yoksa bu.
og_image: /assets/img/og-gestalt.png

# Yazı adresleri: gestaltmedya.com/blog/yazi-adi/
permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      image: /assets/img/og-gestalt.png
  - scope: { path: "" }
    values:
      layout: page
      image: /assets/img/og-gestalt.png

exclude:
  - README.md
  - CLAUDE.md
  - Web-Sitesi-Rehberi.pdf
  - YAZI-REHBERI.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
